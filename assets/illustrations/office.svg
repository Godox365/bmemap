<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#1b222a"/>
  <!-- Padló -->
  <rect y="155" width="400" height="45" fill="#12171d"/>
  <line x1="0" y1="155" x2="400" y2="155" stroke="#26303b" stroke-width="2"/>

  <!-- Háttérben lebegő könyvespolc könyvekkel -->
  <rect x="70" y="45" width="120" height="5" rx="1.5" fill="#2d3744"/>
  <!-- Könyvek a polcon -->
  <rect x="80" y="27" width="8" height="18" rx="1" fill="#475569"/>
  <rect x="89" y="24" width="7" height="21" rx="1" fill="#64748b"/>
  <rect x="97" y="28" width="9" height="17" rx="1" fill="#3b82f6"/>
  <rect x="107" y="26" width="6" height="19" rx="1" fill="#475569"/>
  <!-- Mappák / dossziék -->
  <polygon points="145,45 155,45 150,28 140,28" fill="#334155"/>
  <polygon points="155,45 165,45 160,28 150,28" fill="#475569"/>

  <!-- Irodai gurulós szék a háttérben az asztal mögött -->
  <!-- Fejtámla / háttámla -->
  <rect x="220" y="65" width="36" height="48" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="224" y="69" width="28" height="40" rx="4" fill="#242e3b"/>
  <!-- Karfák -->
  <path d="M 213 90 L 218 90 L 218 105" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 263 90 L 258 90 L 258 105" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Irodai íróasztal -->
  <rect x="80" y="115" width="240" height="10" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <!-- Asztal fiókos rész (bal oldal) -->
  <rect x="90" y="125" width="45" height="30" fill="#242e3b"/>
  <line x1="90" y1="135" x2="135" y2="135" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="145" x2="135" y2="145" stroke="#334155" stroke-width="1.5"/>
  <rect x="108" y="129" width="10" height="2" rx="1" fill="#64748b"/>
  <rect x="108" y="139" width="10" height="2" rx="1" fill="#64748b"/>
  <rect x="108" y="149" width="10" height="2" rx="1" fill="#64748b"/>
  <!-- Asztalláb (jobb oldal) -->
  <rect x="300" y="125" width="8" height="30" fill="#242e3b"/>

  <!-- Laptop az asztalon (középen) -->
  <rect x="210" y="93" width="38" height="22" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="213" y="96" width="32" height="16" fill="#0f172a"/>
  <!-- Képernyő világos sáv -->
  <line x1="217" y1="104" x2="235" y2="104" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="204,115 254,115 251,118 207,118" fill="#475569"/>

  <!-- Modern asztali lámpa (bal oldal) -->
  <rect x="145" y="113" width="14" height="2" rx="1" fill="#64748b"/>
  <path d="M 152 113 L 152 82 Q 152 75 160 75 L 170 75" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="168,71 180,78 174,83 162,76" fill="#94a3b8"/>
  <polygon points="172,81 190,115 160,115" fill="#f8fafc" fill-opacity="0.04"/>

  <!-- Kis cserepes szobanövény az asztal szélén (jobb oldal) -->
  <!-- Kaspó -->
  <polygon points="275,115 287,115 285,103 277,103" fill="#64748b"/>
  <!-- Levelek (finom zöldes akcentus) -->
  <ellipse cx="281" cy="98" rx="4" ry="7" fill="#10b981"/>
  <ellipse cx="276" cy="100" rx="3.5" ry="6" fill="#059669" transform="rotate(-30 276 100)"/>
  <ellipse cx="286" cy="100" rx="3.5" ry="6" fill="#059669" transform="rotate(30 286 100)"/>
</svg>
