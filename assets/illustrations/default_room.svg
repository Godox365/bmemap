<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#1b2826"/>
  <!-- Padló -->
  <rect y="150" width="400" height="50" fill="#14201e"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#253b38" stroke-width="2"/>

  <!-- Előadói / Tantermi tábla a falon -->
  <rect x="90" y="25" width="220" height="90" rx="4" fill="#243834" stroke="#35524c" stroke-width="3"/>
  <!-- Krétatartó sáv -->
  <rect x="100" y="112" width="200" height="3" rx="1.5" fill="#4d736b"/>

  <!-- Minimalista táblarajz vázlatok (egy színvilágú flat elemek) -->
  <line x1="110" y1="70" x2="160" y2="70" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="120" y2="90" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120 70 Q 130 55 140 70 T 160 70" fill="none" stroke="#68988e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="185,85 205,55 225,85" fill="none" stroke="#4d736b" stroke-width="2"/>
  <line x1="245" y1="55" x2="285" y2="55" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="65" x2="275" y2="65" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="75" x2="280" y2="75" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>

  <!-- Tanári asztal a bal oldalon -->
  <rect x="40" y="115" width="60" height="35" rx="2" fill="#29423d"/>
  <rect x="38" y="113" width="64" height="4" rx="1" fill="#3d635a"/>
  <!-- Laptop az asztalon -->
  <rect x="55" y="103" width="18" height="10" rx="1" fill="#4d736b"/>
  <polygon points="53,113 75,113 73,115 55,115" fill="#3d635a"/>

  <!-- Diákpadok és székek az előtérben (szimmetrikus, letisztult flat formák) -->
  <!-- Hátsó sor -->
  <rect x="130" y="125" width="65" height="6" rx="1.5" fill="#29423d"/>
  <rect x="145" y="131" width="3" height="19" fill="#243834"/>
  <rect x="175" y="131" width="3" height="19" fill="#243834"/>
  <rect x="215" y="125" width="65" height="6" rx="1.5" fill="#29423d"/>
  <rect x="230" y="131" width="3" height="19" fill="#243834"/>
  <rect x="260" y="131" width="3" height="19" fill="#243834"/>

  <!-- Első padsor (közelebbi, nagyobb flat forma) -->
  <rect x="105" y="152" width="90" height="8" rx="2" fill="#35544e"/>
  <rect x="125" y="160" width="4" height="25" fill="#29423d"/>
  <rect x="175" y="160" width="4" height="25" fill="#29423d"/>
  <!-- Székek -->
  <rect x="115" y="162" width="26" height="14" rx="3" fill="#3d635a"/>
  <rect x="155" y="162" width="26" height="14" rx="3" fill="#3d635a"/>

  <rect x="215" y="152" width="90" height="8" rx="2" fill="#35544e"/>
  <rect x="235" y="160" width="4" height="25" fill="#29423d"/>
  <rect x="285" y="160" width="4" height="25" fill="#29423d"/>
  <rect x="225" y="162" width="26" height="14" rx="3" fill="#3d635a"/>
  <rect x="265" y="162" width="26" height="14" rx="3" fill="#3d635a"/>

  <!-- Minimalista mennyezeti lámpatestek -->
  <line x1="140" y1="0" x2="140" y2="12" stroke="#253b38" stroke-width="1.5"/>
  <rect x="125" y="12" width="30" height="3" rx="1.5" fill="#3d635a"/>
  <line x1="260" y1="0" x2="260" y2="12" stroke="#253b38" stroke-width="1.5"/>
  <rect x="245" y="12" width="30" height="3" rx="1.5" fill="#3d635a"/>
</svg>
