<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#1b2028"/>

  <!-- Perspektivikus folyosó: Mennyezet -->
  <polygon points="0,0 400,0 260,65 140,65" fill="#161a21"/>
  <!-- Mennyezeti modern süllyesztett LED panelek -->
  <polygon points="175,10 225,10 216,28 184,28" fill="#303846"/>
  <polygon points="186,35 214,35 208,48 192,48" fill="#303846"/>

  <!-- Perspektivikus folyosó: Padló -->
  <polygon points="0,200 400,200 260,150 140,150" fill="#13161c"/>
  <line x1="0" y1="200" x2="140" y2="150" stroke="#252c38" stroke-width="2"/>
  <line x1="400" y1="200" x2="260" y2="150" stroke="#252c38" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="150" stroke="#202630" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Folyosó vége (Hátsó fal és kijárat / átjáró) -->
  <rect x="140" y="65" width="120" height="85" fill="#202631" stroke="#2d3545" stroke-width="1.5"/>
  <rect x="180" y="85" width="40" height="65" fill="#161a21" stroke="#374254" stroke-width="1.5"/>
  <rect x="185" y="90" width="30" height="60" fill="#27303d"/>

  <!-- Bal oldali fal és ajtók -->
  <polygon points="0,0 140,65 140,150 0,200" fill="#252c37"/>
  <!-- Bal 1. ajtó (közelebbi) -->
  <polygon points="30,45 75,66 75,166 30,182" fill="#1b2028" stroke="#3a4556" stroke-width="1.5"/>
  <polygon points="36,52 69,67 69,162 36,174" fill="#2e3745"/>
  <line x1="62" y1="110" x2="62" y2="120" stroke="#5b6c85" stroke-width="2"/>

  <!-- Bal 2. ajtó (távolabbi) -->
  <polygon points="90,73 120,86 120,152 90,161" fill="#1b2028" stroke="#343e4f" stroke-width="1.5"/>
  <polygon points="94,77 116,87 116,149 94,156" fill="#2a323f"/>

  <!-- Jobb oldali fal és ajtók -->
  <polygon points="400,0 260,65 260,150 400,200" fill="#252c37"/>
  <!-- Jobb 1. ajtó (közelebbi) -->
  <polygon points="370,45 325,66 325,166 370,182" fill="#1b2028" stroke="#3a4556" stroke-width="1.5"/>
  <polygon points="364,52 331,67 331,162 364,174" fill="#2e3745"/>
  <line x1="338" y1="110" x2="338" y2="120" stroke="#5b6c85" stroke-width="2"/>

  <!-- Jobb 2. ajtó (távolabbi) -->
  <polygon points="310,73 280,86 280,152 310,161" fill="#1b2028" stroke="#343e4f" stroke-width="1.5"/>
  <polygon points="306,77 284,87 284,149 306,156" fill="#2a323f"/>
</svg>
