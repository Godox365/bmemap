<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#241710"/>
  <!-- Padló -->
  <rect y="165" width="400" height="35" fill="#180f0a"/>
  <line x1="0" y1="165" x2="400" y2="165" stroke="#362217" stroke-width="2"/>

  <!-- Kávéautomata fő szekrénytest (Tall Vending Cabinet) -->
  <rect x="145" y="18" width="110" height="147" rx="6" fill="#352218" stroke="#4d3122" stroke-width="2"/>
  <!-- Alsó lábazat -->
  <rect x="155" y="165" width="16" height="5" fill="#20150f"/>
  <rect x="229" y="165" width="16" height="5" fill="#20150f"/>

  <!-- Felső díszpanel / babtartály imitáció -->
  <rect x="155" y="26" width="90" height="26" rx="3" fill="#20140e" stroke="#42291c" stroke-width="1.5"/>
  <!-- Kávészem minimalista flat grafika -->
  <ellipse cx="200" cy="39" rx="8" ry="6" fill="#854d0e" transform="rotate(-25 200 39)"/>
  <path d="M 196 35 Q 200 39 204 43" fill="none" stroke="#20140e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Érintőképernyős / gombos választófelület (Menu Matrix) -->
  <rect x="155" y="58" width="90" height="42" rx="3" fill="#1b110b"/>
  <!-- Kijelző fény / menü gombok -->
  <rect x="162" y="64" width="22" height="14" rx="2" fill="#523221"/>
  <rect x="189" y="64" width="22" height="14" rx="2" fill="#523221"/>
  <rect x="216" y="64" width="22" height="14" rx="2" fill="#523221"/>

  <rect x="162" y="81" width="22" height="14" rx="2" fill="#523221"/>
  <rect x="189" y="81" width="22" height="14" rx="2" fill="#713f12"/> <!-- Kijelölt aktív ital -->
  <rect x="216" y="81" width="22" height="14" rx="2" fill="#523221"/>

  <!-- Kiadó nyílás (Cup dispensing alcove) -->
  <rect x="165" y="106" width="70" height="46" rx="4" fill="#140d08" stroke="#362217" stroke-width="1.5"/>
  <!-- Csészetartó rács -->
  <rect x="172" y="146" width="56" height="3" fill="#4d3122"/>

  <!-- Kávéspohár a kiadóban -->
  <polygon points="193,124 207,124 205,145 195,145" fill="#d97706"/>
  <rect x="191" y="122" width="18" height="3" rx="1" fill="#fef3c7"/>
  <!-- Kis gőzszálak a pohárból -->
  <path d="M 198 118 Q 196 113 200 109" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 203 118 Q 205 114 202 110" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fizető modul a jobb oldalon (kártyaleolvasó) -->
  <rect x="257" y="65" width="10" height="28" rx="2" fill="#352218" stroke="#4d3122" stroke-width="1"/>
  <rect x="259" y="70" width="6" height="3" fill="#22c55e"/> <!-- Zöld LED -->
  <rect x="259" y="77" width="6" height="10" rx="1" fill="#140d08"/>
</svg>
