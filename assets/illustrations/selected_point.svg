<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="var(--art-bg, #1b2826)"/>

  <!-- Térkép / koordináta sík perspektíva -->
  <polygon points="30,170 370,170 340,110 60,110" fill="var(--art-floor, #14201e)"/>
  <line x1="60" y1="110" x2="340" y2="110" stroke="var(--art-floor-line, #253b38)" stroke-width="1.5"/>
  <line x1="45" y1="138" x2="355" y2="138" stroke="var(--art-floor-line, #253b38)" stroke-width="1.5"/>
  <line x1="30" y1="170" x2="370" y2="170" stroke="var(--art-floor-line, #253b38)" stroke-width="2"/>

  <!-- Térképrács hosszanti vonalai -->
  <line x1="120" y1="110" x2="100" y2="170" stroke="var(--art-grid-accent, #35544e)" stroke-width="1.2"/>
  <line x1="175" y1="110" x2="165" y2="170" stroke="var(--art-grid-accent, #35544e)" stroke-width="1.2"/>
  <line x1="225" y1="110" x2="235" y2="170" stroke="var(--art-grid-accent, #35544e)" stroke-width="1.2"/>
  <line x1="280" y1="110" x2="300" y2="170" stroke="var(--art-grid-accent, #35544e)" stroke-width="1.2"/>

  <!-- Földi célkereszt és radar gyűrűk -->
  <ellipse cx="200" cy="149" rx="60" ry="16" fill="none" stroke="var(--art-radar-outer, #243834)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <ellipse cx="200" cy="149" rx="32" ry="9" fill="none" stroke="var(--art-radar-inner, #2d4842)" stroke-width="1.5"/>
  <ellipse cx="200" cy="149" rx="10" ry="3" fill="var(--art-pin-shadow, #0f1716)"/>

  <!-- Célkereszt szálak -->
  <line x1="125" y1="149" x2="145" y2="149" stroke="var(--art-crosshair, #4d736b)" stroke-width="1.5"/>
  <line x1="255" y1="149" x2="275" y2="149" stroke="var(--art-crosshair, #4d736b)" stroke-width="1.5"/>
  <line x1="200" y1="127" x2="200" y2="134" stroke="var(--art-crosshair, #4d736b)" stroke-width="1.5"/>
  <line x1="200" y1="164" x2="200" y2="171" stroke="var(--art-crosshair, #4d736b)" stroke-width="1.5"/>

  <!-- Finomabb, arányosabb gombostű test lekerekített alsó csúccsal -->
  <path d="M 200 86 C 188.5 86 179 95.5 179 107 C 179 122 197.8 145.8 199.1 147.4 A 1.4 1.4 0 0 0 200.9 147.4 C 202.2 145.8 221 122 221 107 C 221 95.5 211.5 86 200 86 Z" fill="var(--art-pin-body, #8a2432)" stroke="var(--art-pin-stroke, #401117)" stroke-width="2.2"/>

  <!-- Csúcsfény ív -->
  <path d="M 187 98 A 14 14 0 0 1 200 91.5" fill="none" stroke="var(--art-pin-highlight, #b83d4f)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Belső sötét fókuszpont -->
  <circle cx="200" cy="106" r="5.5" fill="var(--art-pin-dot, #300d11)"/>
</svg>
