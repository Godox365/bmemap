<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#251b22"/>
  <!-- Padló -->
  <rect y="160" width="400" height="40" fill="#1a1218"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#3d2a37" stroke-width="2"/>

  <!-- Hátsó ruhatári fogas állvány / akasztórúd -->
  <line x1="50" y1="35" x2="350" y2="35" stroke="#523649" stroke-width="4" stroke-linecap="round"/>
  <!-- Állvány tartóoszlopok -->
  <rect x="60" y="35" width="6" height="125" fill="#3a2534"/>
  <rect x="334" y="35" width="6" height="125" fill="#3a2534"/>

  <!-- Vállfák és felakasztott kabátok (letisztult flat sziluettek) -->
  <!-- 1. Kabát -->
  <path d="M 85 43 Q 100 37 115 43 L 118 115 Q 100 120 82 115 Z" fill="#4d2f44" stroke="#663e5b" stroke-width="1.5"/>
  <path d="M 98 35 Q 100 38 100 42" fill="none" stroke="#8a537a" stroke-width="2"/>

  <!-- 2. Kabát -->
  <path d="M 125 43 Q 140 37 155 43 L 158 122 Q 140 126 122 122 Z" fill="#663e5b" stroke="#804e72" stroke-width="1.5"/>
  <path d="M 138 35 Q 140 38 140 42" fill="none" stroke="#a36592" stroke-width="2"/>

  <!-- 3. Kabát -->
  <path d="M 165 43 Q 180 37 195 43 L 198 110 Q 180 114 162 110 Z" fill="#3f2737" stroke="#57364d" stroke-width="1.5"/>
  <path d="M 178 35 Q 180 38 180 42" fill="none" stroke="#754867" stroke-width="2"/>

  <!-- 4. Kabát (BME bordó árnyalat) -->
  <path d="M 205 43 Q 220 37 235 43 L 238 125 Q 220 130 202 125 Z" fill="#8A2432" stroke="#a83244" stroke-width="1.5"/>
  <path d="M 218 35 Q 220 38 220 42" fill="none" stroke="#c44357" stroke-width="2"/>

  <!-- 5. Kabát -->
  <path d="M 245 43 Q 260 37 275 43 L 278 118 Q 260 122 242 118 Z" fill="#523649" stroke="#6b4660" stroke-width="1.5"/>
  <path d="M 258 35 Q 260 38 260 42" fill="none" stroke="#8a537a" stroke-width="2"/>

  <!-- 6. Kabát -->
  <path d="M 285 43 Q 300 37 315 43 L 318 112 Q 300 116 282 112 Z" fill="#42293b" stroke="#5c3952" stroke-width="1.5"/>
  <path d="M 298 35 Q 300 38 300 42" fill="none" stroke="#7a4c6d" stroke-width="2"/>

  <!-- Előtéri ruhatári kiadó pult (Cloakroom counter) -->
  <rect x="30" y="130" width="340" height="14" rx="2" fill="#54374c" stroke="#6e4763" stroke-width="1.5"/>
  <rect x="35" y="144" width="330" height="20" fill="#2d1c28"/>
  <line x1="35" y1="154" x2="365" y2="154" stroke="#402839" stroke-width="1.5"/>

  <!-- Ruhatári biléták / sorszám kártyák a pulton -->
  <!-- Biléta 1 (fém vagy műanyag karika kivágással) -->
  <rect x="180" y="126" width="18" height="10" rx="2" fill="#d48a97" stroke="#b36473" stroke-width="1"/>
  <circle cx="185" cy="131" r="2" fill="#54374c"/>
  <rect x="205" y="126" width="18" height="10" rx="2" fill="#c44357" stroke="#8A2432" stroke-width="1"/>
  <circle cx="210" cy="131" r="2" fill="#54374c"/>
</svg>
