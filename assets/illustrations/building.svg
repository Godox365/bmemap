<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#1b2826"/>

  <!-- Épület előtti tér és sétány (padló) -->
  <rect y="160" width="400" height="40" fill="#14201e"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#253b38" stroke-width="2"/>

  <!-- Fák és növényzet a háttérben két oldalt (flat geometriai formák) -->
  <circle cx="45" cy="140" r="22" fill="#20332f"/>
  <circle cx="65" cy="145" r="16" fill="#253c37"/>
  <rect x="52" y="152" width="4" height="10" fill="#182724"/>

  <circle cx="355" cy="140" r="22" fill="#20332f"/>
  <circle cx="335" cy="145" r="16" fill="#253c37"/>
  <rect x="344" y="152" width="4" height="10" fill="#182724"/>

  <!-- Épület hátsó szárnyai (bal és jobb oldalszárny) -->
  <rect x="65" y="80" width="75" height="80" rx="1" fill="#223632"/>
  <rect x="260" y="80" width="75" height="80" rx="1" fill="#223632"/>

  <!-- Oldalszárnyak tetőpárkánya -->
  <rect x="62" y="76" width="81" height="5" rx="1" fill="#2d4842"/>
  <rect x="257" y="76" width="81" height="5" rx="1" fill="#2d4842"/>

  <!-- Oldalszárnyak ablakai (szimmetrikus flat rács) -->
  <!-- Bal szárny felső szint -->
  <rect x="75" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="96" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="117" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <!-- Bal szárny alsó szint -->
  <rect x="75" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="96" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="117" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>

  <!-- Jobb szárny felső szint -->
  <rect x="271" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="292" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="313" y="90" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <!-- Jobb szárny alsó szint -->
  <rect x="271" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="292" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>
  <rect x="313" y="125" width="12" height="18" rx="1" fill="#1b2826" stroke="#3d635a" stroke-width="1.2"/>

  <!-- Főépület központi tömb (aula és timpanon) -->
  <rect x="130" y="60" width="140" height="100" fill="#29423d"/>

  <!-- Főpárkány és gerendázat -->
  <rect x="124" y="55" width="152" height="7" rx="1" fill="#35544e"/>

  <!-- Timpanon (klasszikus egyetemi homlokzat háromszöge) -->
  <polygon points="120,55 200,22 280,55" fill="#2d4842" stroke="#3d635a" stroke-width="2"/>
  <!-- Timpanon belső díszítés (egyetemi embléma kör) -->
  <circle cx="200" cy="42" r="7" fill="#243834" stroke="#4d736b" stroke-width="1.5"/>

  <!-- Zászlórúd a timpanon csúcsán -->
  <line x1="200" y1="22" x2="200" y2="8" stroke="#4d736b" stroke-width="1.5"/>
  <polygon points="200,8 214,12 200,16" fill="#68988e"/>

  <!-- Kolonnád / Oszlopcsarnok (egyetemi oszlopok a bejárat előtt) -->
  <!-- 1. Oszlop -->
  <rect x="144" y="62" width="8" height="78" fill="#3d635a"/>
  <rect x="142" y="62" width="12" height="3" fill="#4d736b"/>
  <rect x="142" y="137" width="12" height="3" fill="#4d736b"/>

  <!-- 2. Oszlop -->
  <rect x="174" y="62" width="8" height="78" fill="#3d635a"/>
  <rect x="172" y="62" width="12" height="3" fill="#4d736b"/>
  <rect x="172" y="137" width="12" height="3" fill="#4d736b"/>

  <!-- 3. Oszlop -->
  <rect x="218" y="62" width="8" height="78" fill="#3d635a"/>
  <rect x="216" y="62" width="12" height="3" fill="#4d736b"/>
  <rect x="216" y="137" width="12" height="3" fill="#4d736b"/>

  <!-- 4. Oszlop -->
  <rect x="248" y="62" width="8" height="78" fill="#3d635a"/>
  <rect x="246" y="62" width="12" height="3" fill="#4d736b"/>
  <rect x="246" y="137" width="12" height="3" fill="#4d736b"/>

  <!-- Főbejárati kapu (boltíves reprezentatív bejárat) -->
  <path d="M 188 140 L 188 108 Q 200 96 212 108 L 212 140 Z" fill="#1b2826" stroke="#4d736b" stroke-width="1.8"/>
  <line x1="200" y1="102" x2="200" y2="140" stroke="#35524c" stroke-width="1.2"/>

  <!-- Bejárati lépcsősor (talapzat) -->
  <rect x="135" y="140" width="130" height="6" fill="#35544e"/>
  <rect x="125" y="146" width="150" height="6" fill="#2d4842"/>
  <rect x="115" y="152" width="170" height="8" fill="#243834"/>

  <!-- Lámpaoszlopok a bejárat előtt balra és jobbra -->
  <line x1="100" y1="160" x2="100" y2="135" stroke="#3d635a" stroke-width="1.5"/>
  <circle cx="100" cy="133" r="3" fill="#68988e"/>
  
  <line x1="300" y1="160" x2="300" y2="135" stroke="#3d635a" stroke-width="1.5"/>
  <circle cx="300" cy="133" r="3" fill="#68988e"/>
</svg>
