<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#1b2826"/>
  <!-- Padló szintek (lépcsőzetes nagyelőadó) -->
  <polygon points="0,140 400,140 400,200 0,200" fill="#14201e"/>
  <line x1="0" y1="140" x2="400" y2="140" stroke="#253b38" stroke-width="2"/>
  <line x1="0" y1="165" x2="400" y2="165" stroke="#253b38" stroke-width="1.5"/>

  <!-- Nagyelőadói vetítővászon / nagy tábla a falon -->
  <rect x="100" y="20" width="200" height="85" rx="3" fill="#243834" stroke="#35524c" stroke-width="2.5"/>
  <line x1="110" y1="102" x2="290" y2="102" stroke="#4d736b" stroke-width="2"/>

  <!-- Minimalista prezentációs diagram a vásznon (flat) -->
  <line x1="125" y1="65" x2="165" y2="65" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="45" x2="130" y2="85" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130 75 L 140 60 L 150 70 L 165 45" fill="none" stroke="#68988e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <circle cx="210" cy="55" r="14" fill="none" stroke="#4d736b" stroke-width="2"/>
  <path d="M 210 55 L 210 45 M 210 55 L 220 55" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>

  <line x1="245" y1="45" x2="280" y2="45" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="55" x2="275" y2="55" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="65" x2="282" y2="65" stroke="#4d736b" stroke-width="2" stroke-linecap="round"/>

  <!-- Előadói emelvény és pulpitus -->
  <rect x="50" y="95" width="28" height="45" rx="2" fill="#29423d"/>
  <rect x="47" y="93" width="34" height="4" rx="1" fill="#3d635a"/>

  <!-- Lépcsőzetes előadói padsorok az előtérben (szép flat rétegek) -->
  <!-- 1. Padsor (felső) -->
  <rect x="110" y="118" width="180" height="6" rx="1.5" fill="#29423d"/>
  <!-- 2. Padsor (középső) -->
  <rect x="90" y="142" width="220" height="7" rx="2" fill="#35544e"/>
  <rect x="110" y="151" width="30" height="10" rx="2" fill="#29423d"/>
  <rect x="185" y="151" width="30" height="10" rx="2" fill="#29423d"/>
  <rect x="260" y="151" width="30" height="10" rx="2" fill="#29423d"/>

  <!-- 3. Padsor (alsó, előtéri) -->
  <rect x="70" y="168" width="260" height="9" rx="2" fill="#3d635a"/>
  <rect x="95" y="180" width="40" height="14" rx="2" fill="#2e4c44"/>
  <rect x="180" y="180" width="40" height="14" rx="2" fill="#2e4c44"/>
  <rect x="265" y="180" width="40" height="14" rx="2" fill="#2e4c44"/>
</svg>
