<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <!-- Háttér -->
  <rect width="400" height="200" fill="#201b2e"/>
  <!-- Padló -->
  <rect y="160" width="400" height="40" fill="#15121f"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#322b47" stroke-width="2"/>

  <!-- Lift keret (Portal frame) -->
  <rect x="120" y="24" width="160" height="136" fill="#2d2540" stroke="#433761" stroke-width="2"/>
  <rect x="130" y="34" width="140" height="126" fill="#1c1729"/>

  <!-- Felső szintkijelző doboz -->
  <rect x="165" y="10" width="70" height="18" rx="3" fill="#151121" stroke="#3b3054" stroke-width="1.5"/>
  <!-- Fel nyíl (flat) -->
  <polygon points="188,16 182,22 194,22" fill="#c084fc"/>
  <!-- Szint szám (flat forma) -->
  <rect x="204" y="15" width="8" height="2.5" rx="1" fill="#c084fc"/>
  <rect x="204" y="22" width="8" height="2.5" rx="1" fill="#c084fc"/>
  <rect x="210" y="15" width="2.5" height="5" fill="#c084fc"/>
  <rect x="204" y="20" width="2.5" height="4" fill="#c084fc"/>

  <!-- Bal oldali tolóajtó -->
  <rect x="132" y="36" width="67" height="124" fill="#29223b"/>
  <!-- Szálcsiszolt flat fém dizájncsík -->
  <rect x="175" y="36" width="8" height="124" fill="#362d4e"/>

  <!-- Jobb oldali tolóajtó -->
  <rect x="201" y="36" width="67" height="124" fill="#29223b"/>
  <rect x="217" y="36" width="8" height="124" fill="#362d4e"/>

  <!-- Középső ajtónyílás / gumicsík -->
  <rect x="199" y="36" width="2" height="124" fill="#151121"/>

  <!-- Hívógomb panel a jobb oldali falon -->
  <rect x="300" y="80" width="20" height="38" rx="3" fill="#2d2540" stroke="#3b3054" stroke-width="1.5"/>
  <!-- Fel gomb -->
  <circle cx="310" cy="90" r="4.5" fill="#a855f7"/>
  <polygon points="310,87 307,91 313,91" fill="#ffffff"/>
  <!-- Le gomb -->
  <circle cx="310" cy="106" r="4.5" fill="#1f192d" stroke="#4c3d6d" stroke-width="1"/>
  <polygon points="310,108 307,104 313,104" fill="#9ca3af"/>
</svg>
